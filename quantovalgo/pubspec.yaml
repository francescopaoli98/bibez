name: quantovalgo
description: "QuantoValgo: quanto vale il tuo lavoro"
publish_to: 'none' # app personale, non va su pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  # Serve per i testi di sistema in italiano (calendari, ecc.)
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Nunito incluso nell'app (licenza OFL), così funziona anche offline.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
