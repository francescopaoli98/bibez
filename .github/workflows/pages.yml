name: Pubblica Gym Coach
on:
  push:
    branches: [claude/ai-gym-coach-app-gvnftg]
    paths: ['gym-coach/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gym-coach
      - id: deployment
        uses: actions/deploy-pages@v4
